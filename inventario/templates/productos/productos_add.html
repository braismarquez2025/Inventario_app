{% extends "layout.html" %}

{% block "page_content" %}

{% include "_includes/_header.html" %}

{% load crispy_forms_tags %}

<section class="producto_add">
<h3 class="producto_add-title">Añade un producto</h3>

  <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form|crispy }}
      
      <div class='producto_add-buttons'>
        <button class="btn btn-success">Añadir producto</button>
        <a class="btn btn-secondary" href="{% url 'productos_all'%}">Volver</a>
      </div>
    </form>

</section>

{% endblock %}
